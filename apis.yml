name: Cultivaet Technologies Holding Ltd.
description: Cultivaet Technologies Holding Ltd. is an AI-driven agricultural technology ("AgriTech for
  Humanity") startup based in Egypt serving smallholder farmers across the Middle East. Its products
  include a Farmer AI Companion delivering personalized weather, crop-planning, pest-control and
  soil-health insights, a Knowledge Platform that collects/analyzes/distributes social and scientific
  agricultural data, and a Business SaaS connecting farmers with food-industry buyers for sustainable
  procurement and traceability. The company is backed by 500 Global and Sanabil and is part of the Google
  Cloud Startups Program (pre-seed, 2024). As of this enrichment pass Cultivaet publishes only a marketing
  site (cultivaet.ai) with no public API, developer portal, documentation, SDKs, or other developer
  surface, so no API artifacts were generated.
